<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Paper texture & background gradients -->
    <radialGradient id="paperGlow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#FCFCFA" />
      <stop offset="60%" stop-color="#F4F2EC" />
      <stop offset="100%" stop-color="#E8E5DD" />
    </radialGradient>

    <!-- Mountain mist gradients -->
    <linearGradient id="mistGradLeft" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E8E5DD" stop-opacity="1" />
      <stop offset="50%" stop-color="#A8B0B2" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#606668" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="mistGradFar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E8E5DD" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#CBD1D2" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#9AA0A2" stop-opacity="0.3" />
    </linearGradient>

    <!-- Robe Shading & Ink wash gradients -->
    <linearGradient id="robeGrad" x1="20%" y1="20%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F2EFEB" />
      <stop offset="70%" stop-color="#D5D0C7" />
      <stop offset="100%" stop-color="#3A3836" />
    </linearGradient>

    <linearGradient id="sleeveDarkInk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B2C2D" />
      <stop offset="60%" stop-color="#141415" />
      <stop offset="100%" stop-color="#080808" />
    </linearGradient>

    <!-- Ink splash filters for brush texture -->
    <filter id="inkBrush" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <filter id="softInk" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rice Paper Canvas -->
  <rect width="800" height="600" fill="url(#paperGlow)" />

  <!-- Left Distant Mountains (Pale Ink Wash) -->
  <g opacity="0.45" filter="url(#softInk)">
    <path d="M-50,420 Q-10,280 40,240 Q80,210 120,290 Q150,230 190,260 Q230,300 270,450 Z" fill="url(#mistGradFar)" />
  </g>

  <!-- Left Middle Mountain Crags (Textured Ink Wash) -->
  <g opacity="0.65" filter="url(#inkBrush)">
    <path d="M-20,480 Q20,380 60,350 Q90,320 120,370 Q160,330 200,380 Q240,430 280,520 Z" fill="url(#mistGradLeft)" />
    <!-- Mountain ridges ink brush strokes -->
    <path d="M50,360 Q80,410 90,460" stroke="#4A5052" stroke-width="4" fill="none" opacity="0.3" stroke-linecap="round" />
    <path d="M110,350 Q130,400 150,440" stroke="#3A4042" stroke-width="6" fill="none" opacity="0.35" stroke-linecap="round" />
    <path d="M170,360 Q190,410 200,470" stroke="#2B3032" stroke-width="5" fill="none" opacity="0.4" stroke-linecap="round" />
  </g>

  <!-- Mountain Base Soft Haze -->
  <ellipse cx="120" cy="510" rx="180" ry="60" fill="#E8E5DD" opacity="0.8" />
  <ellipse cx="60" cy="460" rx="140" ry="45" fill="#F4F2EC" opacity="0.7" />

  <!-- Right Distant Cliff & Ancient Pine Tree -->
  <g opacity="0.85">
    <!-- Rocky outcrop -->
    <path d="M680,600 Q710,480 750,420 Q780,380 820,370 L830,600 Z" fill="#4B5052" opacity="0.3" filter="url(#inkBrush)" />
    <path d="M720,600 Q740,510 770,460 Q790,440 820,440 L830,600 Z" fill="#25282A" opacity="0.6" filter="url(#inkBrush)" />
    
    <!-- Ancient Pine Tree Trunk & Branches -->
    <path d="M770,450 Q765,400 755,370 Q750,350 740,340 Q735,335 725,338" stroke="#1C1D1F" stroke-width="4.5" fill="none" stroke-linecap="round" filter="url(#inkBrush)" />
    <path d="M755,370 Q770,355 790,350" stroke="#1C1D1F" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M745,350 Q755,335 770,330" stroke="#1C1D1F" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M738,342 Q728,328 715,325" stroke="#1C1D1F" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Pine Needles / Foliage (Ink dry brush stipples) -->
    <g fill="#141517" opacity="0.75" filter="url(#inkBrush)">
      <ellipse cx="722" cy="335" rx="22" ry="9" />
      <ellipse cx="740" cy="328" rx="26" ry="11" />
      <ellipse cx="765" cy="326" rx="28" ry="10" />
      <ellipse cx="788" cy="346" rx="24" ry="9" />
      <ellipse cx="755" cy="342" rx="20" ry="8" />
    </g>
  </g>

  <!-- Central/Right Scholar Swordsman Figure (水墨侠客/居士) -->
  <g id="figure" transform="translate(40, -10)">
    <!-- Broad Bottom Splash Robe Hem (Deep expressive calligraphy strokes) -->
    <g filter="url(#inkBrush)">
      <!-- Swirling wash trails -->
      <path d="M360,580 Q430,470 470,430 Q510,480 540,580 Q470,600 360,580 Z" fill="url(#sleeveDarkInk)" opacity="0.85" />
      <!-- Splattered ink bottom wash -->
      <path d="M310,600 Q380,510 430,460 Q490,440 560,540 Q570,570 590,600 Z" fill="#18181A" opacity="0.9" />
      <path d="M260,600 Q330,530 380,480 Q440,490 490,590 Z" fill="#323335" opacity="0.6" />
      
      <!-- Expressive ink brush streak accents -->
      <path d="M280,570 Q350,500 410,460" stroke="#0F0F10" stroke-width="8" stroke-linecap="round" opacity="0.8" fill="none" />
      <path d="M330,580 Q390,520 440,480" stroke="#1A1A1C" stroke-width="12" stroke-linecap="round" opacity="0.75" fill="none" />
      <path d="M480,450 Q520,500 550,560" stroke="#111112" stroke-width="14" stroke-linecap="round" opacity="0.9" fill="none" />
      <path d="M510,470 Q540,520 570,580" stroke="#222325" stroke-width="16" stroke-linecap="round" opacity="0.8" fill="none" />
    </g>

    <!-- Main White/Grey Silk Hanfu Robe -->
    <g>
      <!-- Base body silhouette -->
      <path d="M435,215 Q465,225 480,240 Q510,285 530,370 Q545,435 560,490 Q530,510 490,490 Q440,470 410,410 Q390,340 405,270 Q415,230 435,215 Z" fill="url(#robeGrad)" />
      
      <!-- Back robe folds & calligraphy contours -->
      <path d="M435,215 Q415,260 405,330 Q395,410 425,480" stroke="#4A4744" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round" />
      <path d="M450,225 Q435,290 430,370 Q430,440 460,490" stroke="#5C5752" stroke-width="2" fill="none" opacity="0.45" stroke-linecap="round" />
      
      <!-- Right shoulder & back contour -->
      <path d="M480,240 Q508,290 525,370 Q535,420 545,470" stroke="#2A2826" stroke-width="3" fill="none" opacity="0.7" stroke-linecap="round" />

      <!-- Belt (Sash/束腰) with dark ink accents -->
      <path d="M450,335 Q480,350 515,355 Q518,375 485,380 Q455,370 445,350 Z" fill="#1C1B1A" opacity="0.9" />
      <path d="M445,350 Q430,370 418,405" stroke="#181716" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.85" />
      <path d="M455,365 Q445,395 438,435" stroke="#2D2B29" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.75" />

      <!-- Front Inner Collar Line -->
      <path d="M465,225 Q478,255 490,285" stroke="#3A3835" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round" />
      <path d="M455,220 Q470,245 480,265" stroke="#1F1E1D" stroke-width="2.5" fill="none" opacity="0.8" stroke-linecap="round" />
    </g>

    <!-- Head, Face Profile & Neck -->
    <g>
      <!-- Neck -->
      <path d="M462,205 Q465,225 470,235 Q485,232 492,218 Q485,205 475,202 Z" fill="#F0ECE4" />
      <path d="M464,208 Q468,225 472,233" stroke="#8C857B" stroke-width="1.2" fill="none" opacity="0.5" />

      <!-- Face Profile (Right-facing 3/4 side profile) -->
      <!-- Jawline, chin, delicate nose and brow -->
      <path d="M472,175 Q482,178 488,188 Q495,190 500,195 Q496,199 492,202 Q495,206 492,210 Q485,218 474,217 Z" fill="#F5F2EB" />
      
      <!-- Delicate facial features (Ink lines) -->
      <!-- Nose profile -->
      <path d="M490,190 L496,196 L491,198" stroke="#33302C" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round" />
      <!-- Eyelash / Closed-Gentle Gaze -->
      <path d="M482,189 Q486,188 489,191" stroke="#1A1918" stroke-width="1.5" fill="none" stroke-linecap="round" />
      <circle cx="486" cy="191" r="0.8" fill="#1A1918" />
      <!-- Eyebrow (Sharp slender swordsman brow 剑眉) -->
      <path d="M478,183 Q484,180 491,184" stroke="#181716" stroke-width="1.6" fill="none" stroke-linecap="round" />
      <!-- Lips -->
      <path d="M488,204 Q492,204 494,205" stroke="#7A6562" stroke-width="1.2" fill="none" stroke-linecap="round" />
      <!-- Jaw contour -->
      <path d="M492,210 Q484,217 475,216" stroke="#4A453F" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.7" />
      <!-- Ear in profile -->
      <path d="M465,192 Q470,188 472,195 Q472,202 466,204" stroke="#5C554D" stroke-width="1.2" fill="#F0ECE4" stroke-linecap="round" />
    </g>

    <!-- Hairstyle: Topknot Bun (发髻), Hair Ribbon (飘带), & Flowing Long Hair -->
    <g id="hair">
      <!-- High Bun (发髻) -->
      <ellipse cx="468" cy="132" rx="14" ry="12" fill="#141415" filter="url(#softInk)" />
      <path d="M460,132 Q468,120 476,132 Q468,142 460,132 Z" fill="#0A0A0B" />
      <!-- Bun hairpin / wrap ring -->
      <ellipse cx="468" cy="138" rx="8" ry="4" fill="#3D3B38" stroke="#141415" stroke-width="1" />

      <!-- Hair Ribbons floating in wind (发带飘逸) -->
      <path d="M466,138 Q430,145 405,175 Q380,210 350,230" stroke="#2B2A29" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round" />
      <path d="M464,140 Q440,165 425,200 Q400,240 375,265" stroke="#1A1918" stroke-width="1.5" fill="none" opacity="0.5" stroke-linecap="round" />
      <path d="M468,140 Q495,150 515,160 Q540,175 560,185" stroke="#3D3B39" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round" />

      <!-- Main Crown & Forehead Hair -->
      <path d="M455,142 Q470,140 482,152 Q490,162 485,182 Q475,172 465,175 Q455,180 452,195 Q448,175 450,158 Z" fill="#121213" />

      <!-- Flowing Long Dark Hair Cascading down the Back & Wind-swept strands (泼墨发丝) -->
      <g filter="url(#inkBrush)">
        <!-- Massive dark volume of hair -->
        <path d="M460,148 Q445,180 435,225 Q420,285 390,340 Q360,390 320,430 Q350,380 395,310 Q425,250 445,190 Z" fill="#0D0D0E" opacity="0.95" />
        <path d="M450,160 Q430,210 410,270 Q380,340 340,395 Q380,330 420,250 Z" fill="#1A1A1C" opacity="0.85" />
        <path d="M455,180 Q440,240 425,300 Q405,370 365,430 Q400,360 435,280 Z" fill="#151516" opacity="0.9" />
      </g>

      <!-- Fine dynamic individual flyaway hair strands (飘逸发丝细线) -->
      <g stroke="#1A1918" stroke-linecap="round" opacity="0.75">
        <path d="M458,155 Q425,185 395,230 Q360,285 320,335" stroke-width="1.8" fill="none" />
        <path d="M452,170 Q410,215 375,275 Q340,335 295,385" stroke-width="1.4" fill="none" />
        <path d="M448,190 Q405,250 365,315 Q330,380 280,430" stroke-width="1.2" fill="none" />
        <path d="M440,220 Q395,290 350,360 Q310,425 250,470" stroke-width="1.5" fill="none" />
        <path d="M445,240 Q410,310 380,385 Q350,455 300,510" stroke-width="1.6" fill="none" />
        <path d="M465,178 Q455,210 450,250" stroke-width="1.2" fill="none" opacity="0.6" />
        <path d="M472,170 Q468,185 464,202" stroke-width="1.0" fill="none" opacity="0.5" />
      </g>
    </g>
  </g>

  <!-- Atmospheric Foreground Mist & Ink Splatters (东方意境留白与泼墨) -->
  <g opacity="0.4" filter="url(#softInk)">
    <ellipse cx="280" cy="550" rx="180" ry="40" fill="#FCFCFA" />
    <ellipse cx="500" cy="570" rx="220" ry="35" fill="#FCFCFA" />
  </g>

  <!-- Traditional Red Seal / Stamp in upper right corner (朱砂雅印) -->
  <g transform="translate(730, 45)" opacity="0.85">
    <rect x="0" y="0" width="32" height="32" rx="4" fill="#B91C1C" />
    <rect x="2" y="2" width="28" height="28" rx="2" fill="none" stroke="#FEF2F2" stroke-width="1.2" opacity="0.8" />
    <!-- Seal Characters "水墨" / "逸韵" in ancient seal script -->
    <path d="M9,8 L9,24 M15,8 L15,24 M9,16 L15,16 M21,8 L21,24 M18,12 L24,12 M18,20 L24,20" stroke="#FEF2F2" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>
